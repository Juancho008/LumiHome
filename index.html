<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Lumi Home — textiles y decoración de hogar con confort premium."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Lumi Home</title>
    <style>
      html,
      body {
        margin: 0;
        background: #f9f8f6;
      }
      #lumi-splash {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f9f8f6;
        color: #111111;
      }
      #lumi-splash.is-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 0.72s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.72s;
      }
      .lumi-splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .lumi-splash-word {
        margin: 0;
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: clamp(2.6rem, 8vw, 4.4rem);
        font-weight: 500;
        letter-spacing: 0.18em;
        line-height: 1;
      }
      .lumi-splash-row {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-top: 18px;
      }
      .lumi-splash-line {
        display: block;
        width: 36px;
        height: 1px;
        background: #c5a059;
      }
      .lumi-splash-home {
        margin: 0;
        font-family: Montserrat, ui-sans-serif, system-ui, sans-serif;
        font-size: 11px;
        font-weight: 400;
        letter-spacing: 0.58em;
      }
      .lumi-splash-bar {
        width: 72px;
        height: 1px;
        margin-top: 36px;
        overflow: hidden;
        background: #d8d4cd;
      }
      .lumi-splash-bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        background: #c5a059;
        animation: lumi-splash-progress 1.6s ease-in-out infinite;
      }
      .lumi-splash-caption {
        margin: 18px 0 0;
        font-family: Montserrat, ui-sans-serif, system-ui, sans-serif;
        font-size: 10px;
        font-weight: 400;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: #7a7a7a;
      }
      @keyframes lumi-splash-progress {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(250%); }
      }
    </style>
  </head>
  <body class="splash-locked">
    <div
      id="lumi-splash"
      role="status"
      aria-live="polite"
      aria-label="Cargando Lumi Home"
    >
      <div class="lumi-splash-inner">
        <p class="lumi-splash-word">LUMI</p>
        <div class="lumi-splash-row">
          <span class="lumi-splash-line" aria-hidden="true"></span>
          <p class="lumi-splash-home">HOME</p>
          <span class="lumi-splash-line" aria-hidden="true"></span>
        </div>
        <div class="lumi-splash-bar" aria-hidden="true"></div>
        <p class="lumi-splash-caption">Cargando</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
